name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      - name: Kernel tests (separate module)
        working-directory: platform
        run: go test -race -timeout 120s -count=1 ./...

      - name: Protocol module build (separate module)
        working-directory: protocol
        run: go build ./... && go vet ./...

  installable:
    name: Installable from its own tag
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `go get` only proves the zip validates; this proves a user can install the broker.
      # It can only run on a tag, because the tag is what the module path resolves to.
      #
      # The proxy lags a fresh tag by seconds to minutes, and an install that races it
      # fails with "unknown revision", which is indistinguishable from a broken release.
      # Retry rather than teach everyone to ignore a red release run.
      - name: go install the broker from a clean module
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          go mod init installcheck >/dev/null
          for attempt in $(seq 1 12); do
            if GOBIN="$tmp/bin" go install "github.com/aj-nt/gaap/cmd/gaapd@${GITHUB_REF_NAME}"; then
              "$tmp/bin/gaapd" -version
              exit 0
            fi
            echo "attempt $attempt: proxy does not serve ${GITHUB_REF_NAME} yet; retrying in 30s"
            sleep 30
          done
          echo "::error::the proxy never served ${GITHUB_REF_NAME}; the tag exists but is not installable"
          exit 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
