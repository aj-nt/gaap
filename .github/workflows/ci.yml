name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests: race + vet + build ──
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check build
        run: go build ./...

      # The workspace maps platform/ and protocol/ to this checkout, which is right for
      # development and wrong for the thing users install: a consumer gets the published
      # tags. Without this step, drift between the tree and the tags is first discovered
      # by somebody's `go get`.
      - name: Consumer view (published tags, no workspace)
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go build ./...
          go vet ./...

      # The kernel is a separate module, so the `./...` above does NOT reach it.
      # Without these steps the split would silently drop the governance kernel
      # from CI entirely — and the code with the guarantees is the code most worth
      # testing.
      - name: Kernel tests (separate module)
        working-directory: platform
        run: go test -race -timeout 120s -count=1 ./...

      - name: Kernel vet
        working-directory: platform
        run: go vet ./...

      # Same reason as the kernel: `./...` at the root does not reach a nested module.
      # The protocol module is types and constants, so this proves it compiles and is
      # vetted — which is the whole guarantee such a module can offer.
      - name: Protocol module build and vet
        working-directory: protocol
        run: go build ./... && go vet ./...

  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m

      - name: golangci-lint (kernel module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m
          working-directory: platform

      - name: golangci-lint (protocol module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m
          working-directory: protocol

  # ── Security scan ──
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
