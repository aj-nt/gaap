name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Tests: race + vet + build ──
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -timeout 120s -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check build
        run: go build ./...

      # The kernel is a separate module, so the `./...` above does NOT reach it.
      # Without these steps the split would silently drop the governance kernel
      # from CI entirely — and the code with the guarantees is the code most worth
      # testing.
      - name: Kernel tests (separate module)
        working-directory: platform
        run: go test -race -timeout 120s -count=1 ./...

      - name: Kernel vet
        working-directory: platform
        run: go vet ./...

  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m

      - name: golangci-lint (kernel module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: "binary"
          args: --timeout=5m
          working-directory: platform

  # ── Security scan ──
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
